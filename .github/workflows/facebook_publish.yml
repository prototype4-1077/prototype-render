name: Publish to Facebook

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "space-separated slugs to publish"
        required: true
        default: ""
      force:
        description: "Allow an intentional duplicate upload"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: facebook-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate explicit request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SLUGS="${{ github.event.inputs.slugs }}"
          if [[ -z "$SLUGS" ]]; then
            echo "An explicit slug is required; refusing to publish the entire queue."
            exit 1
          fi
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Publish to Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          force_flag=""
          [[ "${{ github.event.inputs.force }}" == "true" ]] && force_flag="--force"
          python3 pipeline/fb_publish.py $force_flag ${{ steps.request.outputs.slugs }}

      - name: Commit durable publish receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "facebook-publish-bot"
          git config user.email "facebook-publish@users.noreply.github.com"
          git add pipeline/fb_published_result.json
          git commit -m "publish: record Facebook receipt for ${{ steps.request.outputs.slugs }}" || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((i * 2))
          done
          echo "upload succeeded but publish receipt could not be persisted" >&2
          exit 1
