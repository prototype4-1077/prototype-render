name: External signal radar

on:
  schedule:
    - cron: "20 12 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: Collect public live signals instead of only validating the capability layer
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: external-signal-radar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Agent Reach capability layer
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "agent-reach==1.4.0" || \
            python -m pip install --quiet "https://github.com/Panniantong/Agent-Reach/archive/refs/tags/v1.4.0.zip"

      - name: Collect public signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live_flag="--live"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.live }}" != "true" ]; then
            live_flag=""
          fi
          python3 intelligence_stack/reach/collect.py $live_flag

      - name: Validate minimized output
        run: |
          python3 - <<'PY'
          import json
          payload = json.load(open('concept/external_signals/LATEST.json', encoding='utf-8'))
          for record in payload['records']:
              assert record['claim_status'] == 'unverified'
              assert record['rights_status'] == 'reference_only'
              assert len(record.get('excerpt') or '') <= 280
              assert 'cookie' not in json.dumps(record).lower()
          print('validated', payload['record_count'], 'external signals')
          PY

      - name: Commit signal brief
        shell: bash
        run: |
          git config user.name "signal-radar-bot"
          git config user.email "signal-radar@users.noreply.github.com"
          git add \
            concept/external_signals/LATEST.json \
            concept/external_signals/DAILY_SIGNAL_BRIEF.md
          git commit -m "signals: refresh external radar" || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep $((i * 2))
          done
          echo "unable to push external signal refresh" >&2
          exit 1
