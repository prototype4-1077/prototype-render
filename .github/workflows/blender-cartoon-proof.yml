name: Blender Cartoon Proof (Phase 1)

# Manual-only. Runs GPT's first worker-side test on a real headless Blender:
# provisions Blender, renders scene 0 of the Phase 1 example, uploads the PNG.
# Doubles as the reusable Blender-provisioning recipe for render.yml (Phase 2).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch or sha that carries the Blender backend"
        required: false
        default: "blender-cartoon-phase-1"
      scene:
        description: "zero-based scene index to render"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLENDER_VERSION: "4.2.0"
      BLENDER_SERIES: "Blender4.2"
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Install headless runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxrandr2 \
            libxinerama1 libxcursor1 libxkbcommon0 libsm6 libgl1 libegl1 \
            libglu1-mesa libwayland-client0 libwayland-egl1 libdbus-1-3 xz-utils

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender (cache miss only)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "Downloading $url"
          curl -fL --retry 3 -o /tmp/blender.tar.xz "$url"
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1

      - name: Verify Blender launches headless
        run: /opt/blender/blender --background --version

      - name: Motion-plan contract tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest pipeline/tests/test_cartoon_motion.py -q

      - name: Render Phase 1 proof frame
        env:
          BLENDER_BIN: /opt/blender/blender
        run: |
          set -euo pipefail
          python3 -m pipeline.blender_cartoon \
            examples/cartoon-motion-phase1.json \
            --scene "${{ github.event.inputs.scene }}" \
            --preview \
            --output-dir proof-out
          ls -la proof-out

      - name: Upload proof frame
        uses: actions/upload-artifact@v4
        with:
          name: blender-cartoon-proof
          path: proof-out/*.png
          if-no-files-found: error
