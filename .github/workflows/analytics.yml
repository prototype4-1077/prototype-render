name: Audience analytics sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Minimal deps
        run: pip install -q numpy

      - name: Pull retention curves and apply audience learning
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 pipeline/analytics_sync.py

      - name: Mine audience comments + refresh intelligence
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 concept/comment_mining.py || echo "comment mining skipped"
          python3 concept/intelligence.py > concept/INTELLIGENCE_REPORT.md || true

      - name: Commit learned state
        shell: bash
        run: |
          git config user.name "analytics-bot"
          git config user.email "analytics@users.noreply.github.com"
          for f in pipeline/memory.json pipeline/taste.npz pipeline/WHATS_WORKING.md \
                   build/*/retention.json build/*/yt_stats.json \
                   concept/audience_signal.json concept/INTELLIGENCE_REPORT.md concept/craft_ledger.json; do
            git add "$f" 2>/dev/null || true
          done
          git commit -m "analytics: audience retention learning" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          echo "unable to push analytics outcome" >&2
          exit 1
