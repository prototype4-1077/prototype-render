name: Package preferred video delivery

on:
  push:
    paths:
      - "build/*/delivery.request"

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.request.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: request
        shell: bash
        run: |
          file="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
            grep -E '^build/[^/]+/delivery\.request$' | head -n 1)"
          test -n "$file"
          slug="$(printf '%s' "$file" | cut -d/ -f2)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Mark delivery started
        shell: bash
        run: |
          slug="${{ steps.request.outputs.slug }}"
          printf '%s\n' "$GITHUB_RUN_ID" > "build/$slug/delivery-started.txt"
          git config user.name "delivery-bot"
          git config user.email "delivery@users.noreply.github.com"
          git add "build/$slug/delivery-started.txt"
          git commit -m "delivery $slug: started $GITHUB_RUN_ID"
          git push

  package:
    needs: detect
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ needs.detect.outputs.slug }}
    steps:
      - name: Download preferred release assets
        shell: bash
        run: |
          mkdir -p delivery
          tag="video-$SLUG"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          for asset in final_youtube.mp4 scene-review.html scene-review.json; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir delivery
          done
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "music_variants.json" --dir delivery || true
          mv delivery/final_youtube.mp4 "delivery/$SLUG-youtube.mp4"
          mv delivery/scene-review.html "delivery/$SLUG-scene-review.html"
          mv delivery/scene-review.json "delivery/$SLUG-scene-review.json"
          test -s "delivery/$SLUG-youtube.mp4"
          test -s "delivery/$SLUG-scene-review.html"
          test -s "delivery/$SLUG-scene-review.json"

      - name: Upload stable delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}-preferred-delivery
          path: delivery/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
